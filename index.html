<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evitamos el zoom táctil en móviles para no deformar la cámara -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tarjeta AR - Yordi Flores</title>
    
    <!-- Librerías A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
        }
        
        #ui-container {
            position: absolute; 
            bottom: 30px; 
            left: 0; 
            width: 100%;
            text-align: center; 
            z-index: 9999; 
            display: none;
        }
        
        .btn-portafolio {
            padding: 14px 28px; 
            background-color: #00AEEF; 
            color: #FFFFFF;
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #00FF00;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Botón HTML superpuesto -->
    <div id="ui-container">
        <a href="https://github.com/Yordi24k" class="btn-portafolio" target="_blank">🚀 Ver Portafolio GitHub</a>
    </div>

    <!-- Escena AR ajustada para cámaras de teléfono -->
    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; maxDetectionRate: 60; canvasWidth: 640; canvasHeight: 480;" 
             vr-mode-ui="enabled: false">
        
        <a-assets>
            <img id="mi-foto" src="foto.png">
        </a-assets>

        <!-- LADO FRONTAL: Marcador Hiro -->
        <a-marker preset="hiro" id="hiro-marker" emitevents="true">
            
            <!-- Panel base 3D de fondo -->
            <a-plane position="0 0.1 0" rotation="-90 0 0" width="3.2" height="2" color="#111827" opacity="0.9" side="double"></a-plane>
            <a-plane position="0 0.11 0" rotation="-90 0 0" width="3.25" height="2.05" color="#00FF00" opacity="0.6" wireframe="true" side="double"></a-plane>

            <!-- Foto de perfil -->
            <a-image src="#mi-foto" position="-1 0.2 0" rotation="-90 0 0" width="0.9" height="1.1" side="double"></a-image>

            <!-- Textos informativos 3D -->
            <a-text value="Yordi Flores Gomez" 
                    position="-0.3 0.2 -0.6" rotation="-90 0 0" color="#00FF00" width="3.5" side="double"></a-text>
            
            <a-text value="Ing. en Computacion y Redes" 
                    position="-0.3 0.2 -0.3" rotation="-90 0 0" color="#00AEEF" width="2.8" side="double"></a-text>

            <a-text value="Especialidades:\n- Redes & Cisco IOS\n- VHDL & Sistemas Digitales\n- C/C++ & VB.NET\n- AWS Cloud" 
                    position="-0.3 0.2 0.3" rotation="-90 0 0" color="#FFFFFF" width="2.2" side="double"></a-text>

        </a-marker>

        <!-- LADO TRASERO: Marcador Kanji -->
        <a-marker preset="kanji" id="back-marker">
            <a-plane position="0 0.1 0" rotation="-90 0 0" width="3.2" height="2" color="#0d1117" opacity="0.9" side="double"></a-plane>
            <a-text value="Proyectos Destacados:\n\n1. Topologias Multi-VLAN Cisco\n2. Sistema IoT Eco-Green\n3. Simulador Banker's Algorithm\n4. Shell personalizado en C" 
                    position="-1.3 0.2 0" rotation="-90 0 0" color="#00FF00" width="3.2" side="double"></a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const hiroMarker = document.querySelector('#hiro-marker');
        const uiContainer = document.querySelector('#ui-container');

        hiroMarker.addEventListener('markerFound', function() {
            uiContainer.style.display = 'block';
        });

        hiroMarker.addEventListener('markerLost', function() {
            uiContainer.style.display = 'none';
        });
    </script>

</body>
</html>
